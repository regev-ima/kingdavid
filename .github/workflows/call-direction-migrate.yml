name: Call Analytics Direction — apply migration

# Adds inbound/outbound to the call_analytics layer: an optional p_direction on
# the windowed aggregates, a per-direction summary function, a direction
# breakdown per rep, and the direction column on call_logs_detailed. Idempotent.
# Runs on the feature branch too so the preview has the updated functions.

on:
  push:
    branches:
      - main
      - claude/payment-custom-items-ipi3jv
    paths:
      - 'supabase/migrations/20260802000001_call_analytics_direction.sql'
      - '.github/workflows/call-direction-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply call_analytics_direction migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260802000001_call_analytics_direction.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
