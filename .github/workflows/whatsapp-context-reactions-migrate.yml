name: WhatsApp context + reactions — apply migrations

# Two migrations, applied in order:
#   20260805000003 — customer_phone_normalized (GENERATED) + indexes on orders /
#     support_tickets and quotes.lead_id, so the "פרטי לקוח" panel is an index
#     probe instead of four sequential scans; plus recovery of reactions that
#     were stored with an empty body and rendered as blank bubbles.
#   20260805000004 — whatsapp_accounts.profile_name, seeded from the stored
#     payloads, so the account's own WhatsApp name can never be filed as a
#     customer's name again. Clears the rows the first repair missed.
# Both idempotent.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260805000003_whatsapp_context_and_reactions.sql'
      - 'supabase/migrations/20260805000004_whatsapp_account_profile_name.sql'
      - '.github/workflows/whatsapp-context-reactions-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          for f in \
            supabase/migrations/20260805000003_whatsapp_context_and_reactions.sql \
            supabase/migrations/20260805000004_whatsapp_account_profile_name.sql ; do
            echo "▸ $f"
            payload=$(jq -Rs '{query: .}' "$f")
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")
            echo "  Management API HTTP $code"
            cat /tmp/resp.json || true
            echo
            test "$code" -lt 400
          done
