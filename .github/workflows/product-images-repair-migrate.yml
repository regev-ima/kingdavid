name: Product images — repair stored URLs

# Applies the URL-repair migration for product photos: broken "<folder>/N.jpg"
# references are resolved to the "<folder>/<name>-0N.jpg" files really in the
# product-images bucket, dead references are dropped, and covers with nothing
# to resolve to fall back to the folder's first existing image. Prices and
# every other product field are untouched; the migration is idempotent.
#
# The second step re-runs the audit's broken-reference count, so the log ends
# with the number that should now be zero.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260819000001_repair_product_image_urls.sql'
      - '.github/workflows/product-images-repair-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the image-URL repair migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260819000001_repair_product_image_urls.sql
          echo "── $f"
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400

      - name: Verify — remaining broken references (expect 0)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          q="
          WITH refs AS (
            SELECT p.name AS product_name, u.url
            FROM public.products p
            CROSS JOIN LATERAL (
              SELECT p.image_url AS url WHERE p.image_url LIKE '%/product-images/%'
              UNION ALL
              SELECT g.url FROM unnest(COALESCE(p.images, '{}'::text[])) AS g(url)
              WHERE g.url LIKE '%/product-images/%'
            ) u
          )
          SELECT r.product_name, r.url
          FROM refs r
          WHERE NOT EXISTS (
            SELECT 1 FROM storage.objects o
            WHERE o.bucket_id = 'product-images'
              AND o.name = replace(split_part(r.url, '/product-images/', 2), '%20', ' ')
          )
          ORDER BY r.product_name;"
          payload=$(jq -n --arg q "$q" '{query: $q}')
          code=$(curl -sS -o /tmp/verify.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          left=$(jq 'length' /tmp/verify.json 2>/dev/null || echo '?')
          echo "── הפניות שבורות שנותרו: $left"
          jq -r '.[] | "\(.product_name)\t\(.url)"' /tmp/verify.json 2>/dev/null || cat /tmp/verify.json
          test "$code" -lt 400
