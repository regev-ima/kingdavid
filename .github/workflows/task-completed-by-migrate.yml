name: Task completed_by — apply migration

# Applies the sales_tasks completed_by/completed_at migration via the Supabase
# Management API on push to main. Idempotent (ADD COLUMN IF NOT EXISTS, CREATE
# OR REPLACE FUNCTION, DROP TRIGGER IF EXISTS before CREATE, backfill guarded on
# IS NULL), so re-runs are safe. Same pattern as lead-import-migrate.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260820000002_sales_task_completed_by.sql'
      - '.github/workflows/task-completed-by-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply sales_task_completed_by migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260820000002_sales_task_completed_by.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
