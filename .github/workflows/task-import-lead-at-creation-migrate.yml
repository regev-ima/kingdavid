name: Task import lead-at-creation — apply migration

# Redefines process_task_import so a task lands on the lead that existed when
# it was created (not the newest lead on the phone), and so two same-minute
# tasks on one lead keep separate identities. CREATE OR REPLACE — idempotent.
# Runs on the feature branch too.

on:
  push:
    branches:
      - main
      - claude/scroll-issue-yzabql
    paths:
      - 'supabase/migrations/20260902000006_task_import_lead_at_creation.sql'
      - '.github/workflows/task-import-lead-at-creation-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply task import lead-at-creation migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260902000006_task_import_lead_at_creation.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
