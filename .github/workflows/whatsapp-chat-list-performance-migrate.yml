name: WhatsApp chat list performance — apply migration

# Rewrites the whatsapp_chats / whatsapp_messages RLS policies so the caller is
# resolved once per statement instead of once per row, and adds the composite
# indexes the conversation list actually reads by. Same access rules, same rows
# — only the plan changes. Idempotent.
#
# Targets main only (plus workflow_dispatch): it replaces row-security policies,
# so it waits for review rather than running off the feature branch.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260805000002_whatsapp_chat_list_performance.sql'
      - '.github/workflows/whatsapp-chat-list-performance-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply whatsapp_chat_list_performance migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260805000002_whatsapp_chat_list_performance.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
