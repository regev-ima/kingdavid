name: Import unique_id match — apply migration

# Makes process_lead_import find the lead that already holds the Kaveret id in
# unique_id, instead of falling through to phone adoption and colliding with
# leads_unique_id_uidx. Also gives a nameless row the phone as its full_name,
# and stops counting a row as both adopted and failed.
# CREATE OR REPLACE — idempotent. Runs on the feature branch too, so the bulk
# runner can pick it up before the merge.

on:
  push:
    branches:
      - main
      - claude/payment-custom-items-ipi3jv
    paths:
      - 'supabase/migrations/20260803000006_import_matches_unique_id.sql'
      - '.github/workflows/import-unique-id-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply unique_id match migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260803000006_import_matches_unique_id.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
