name: Permission roles — apply migration

# Adds users.access_level + users.permission_overrides and the role_permissions
# matrix behind הגדרות ← הרשאות ותפקידים, seeds every existing user's tier from
# their legacy `role`, and extends the privilege-escalation trigger to cover the
# two new columns.
#
# Idempotent (ADD COLUMN IF NOT EXISTS / CREATE TABLE IF NOT EXISTS / ON CONFLICT
# DO NOTHING / DROP POLICY IF EXISTS / CREATE OR REPLACE), and the seed UPDATEs
# are guarded so a re-run never overwrites a level somebody set by hand. Verified
# against a throwaway database with `scripts/local-test-db.sh <file> --twice`.
# Same pattern as app-policies-migrate.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260806000001_permission_roles.sql'
      - '.github/workflows/permission-roles-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply permission roles migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260806000001_permission_roles.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
