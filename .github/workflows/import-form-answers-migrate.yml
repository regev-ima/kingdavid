name: Import form answers — apply migration

# Lets process_lead_import write the lead form's two answers (mattress size,
# where to try it) — facebook_requested_size / facebook_try_at_home — which the
# Kaveret preset now maps and the whitelist used to drop. Adds the columns if
# the database lacks them. CREATE OR REPLACE + ADD COLUMN IF NOT EXISTS —
# idempotent. Runs on the feature branch too, so the next import can pick it
# up before the merge.

on:
  push:
    branches:
      - main
      - claude/scroll-issue-yzabql
    paths:
      - 'supabase/migrations/20260902000001_import_form_answers.sql'
      - '.github/workflows/import-form-answers-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply form answers migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260902000001_import_form_answers.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
