name: Backfill lead contacts — run to completion

# Attaches every existing lead to a contact, looping until there is nothing
# left. Replaces clicking SELECT backfill_lead_contacts_all() a dozen times in
# the SQL editor.
#
# Manual only (workflow_dispatch) — this writes data, and nothing about a push
# to main means "now is a good time to run a 45-minute backfill".
#
# Safe to re-run and safe to interrupt: each call only touches leads whose
# contact_id is still NULL, so a cancelled run simply leaves the rest for the
# next one. Nothing is deleted and no lead is processed twice.

on:
  workflow_dispatch:
    inputs:
      chunk:
        description: 'Leads per request (each request is its own transaction)'
        required: false
        default: '1000'
      max_seconds:
        description: 'Seconds of work per API call (keep under the API timeout)'
        required: false
        default: '240'
      max_calls:
        description: 'Safety cap on the number of requests'
        required: false
        default: '400'

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 45 min of database work plus slack. Well under the 6h job limit, but
    # bounded so a stuck run cannot idle for hours.
    timeout-minutes: 120

    steps:
      - name: Run backfill until done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CHUNK: ${{ inputs.chunk }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi

          url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"
          total_attached=0

          for i in $(seq 1 "${MAX_CALLS}"); do
            # session_replication_role='replica' suppresses user triggers for
            # THIS transaction only — not globally, so concurrent app traffic is
            # untouched.
            #
            # This is the whole reason the backfill crawled and then died. leads
            # carries auto_update_lead_counters(), which on EVERY single row
            # update runs
            #   UPDATE lead_counters SET total_leads = (SELECT COUNT(*) FROM leads …)
            # — a full scan of 115k rows. A 2000-row chunk therefore performed
            # 2000 full table scans and hit the statement timeout.
            #
            # Safe to suppress here: the backfill sets contact_id explicitly
            # rather than relying on the attach trigger, and lead_counters is
            # recomputed absolutely (SET = COUNT(*)), so it self-corrects on the
            # next lead write. The nudge below forces that immediately.
            # ONE CHUNK PER REQUEST — deliberately backfill_lead_contacts, not
            # the _all wrapper.
            #
            # resolve_or_create_contact takes pg_advisory_xact_lock per phone to
            # stop two sessions creating the same contact twice. Transaction
            # locks are only released at COMMIT, and the _all wrapper loops
            # every chunk inside ONE transaction — so locks piled up until the
            # lock table overflowed:
            #   ERROR 53200: out of shared memory
            #   HINT: You might need to increase "max_locks_per_transaction"
            #
            # Looping out here instead makes every chunk its own transaction, so
            # its locks are freed before the next one starts. The advisory lock
            # keeps doing its job within a chunk, which is where the race it
            # guards against actually lives.
            sql="SET LOCAL session_replication_role = 'replica'; SELECT public.backfill_lead_contacts(${CHUNK});"
            payload=$(jq -Rns --arg q "$sql" '{query: $q}')

            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$url" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")

            if [ "$code" -ge 400 ]; then
              echo "::error::Management API returned HTTP $code"
              cat /tmp/resp.json || true
              exit 1
            fi

            # The API answers [{"backfill_lead_contacts_all": {...}}]. Pull the
            # object out once and read every field from it, so a shape change
            # fails loudly here instead of looping forever on a null `done`.
            # Found recursively, not by position: with two statements the API
            # may answer one result array per statement, and indexing [0] blindly
            # errors out.
            # backfill_lead_contacts returns a bare row count, so the answer is
            # [{"backfill_lead_contacts": 1000}]. Located recursively for the
            # same reason as before: two statements can yield two result arrays.
            attached=$(jq -r '[.. | objects | select(has("backfill_lead_contacts"))] | first | .backfill_lead_contacts // empty' /tmp/resp.json)
            if [ -z "$attached" ] || [ "$attached" = "null" ]; then
              echo "::error::Unexpected response shape"; cat /tmp/resp.json; exit 1
            fi

            total_attached=$(( total_attached + attached ))
            echo "chunk ${i}: attached ${attached} (total ${total_attached})"

            # A chunk that returns fewer rows than asked for means the queue is
            # drained — nothing left that matches the WHERE clause.
            done_flag=false
            if [ "$attached" -lt "${CHUNK}" ]; then done_flag=true; fi

            if [ "$done_flag" = "true" ]; then
              # Counters went unmaintained while triggers were suppressed. One
              # ordinary write with triggers live makes the trigger recompute
              # them from scratch — which is how it computes them anyway.
              nudge="UPDATE public.leads SET updated_date = updated_date WHERE id = (SELECT id FROM public.leads LIMIT 1);"
              curl -sS -o /dev/null -X POST "$url" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$(jq -Rns --arg q "$nudge" '{query: $q}')" || true
              echo "counters recomputed"
              echo "✅ backfill complete — ${total_attached} leads attached across ${i} chunk(s)"
              echo "### Backfill complete" >> "$GITHUB_STEP_SUMMARY"
              echo "- Leads attached this run: **${total_attached}**" >> "$GITHUB_STEP_SUMMARY"
              echo "- Chunks: **${i}**" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # NOTE: the "attached is 0" case is already covered above — 0 is
            # less than any chunk size, so it exits through the done branch.
            # An earlier revision repeated the check here and referenced a
            # ${remaining} variable that no longer exists; under `set -u` that
            # would have aborted the run rather than warning. Removed rather
            # than repaired: one exit path is easier to reason about than two.
          done

          echo "::warning::Hit the ${MAX_CALLS}-call cap with work remaining. Re-run to continue."
