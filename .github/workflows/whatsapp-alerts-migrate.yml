name: WhatsApp disconnect alerts — apply migration

# Adds whatsapp_alert_settings (who sends the alert, which group gets it),
# whatsapp_alert_log, and the per-account outage bookkeeping columns on
# whatsapp_accounts that make the alert fire once per outage instead of once
# per webhook. Idempotent. Runs on the feature branch too so the preview has it.

on:
  push:
    branches:
      - main
      - claude/disconnected-rep-notifications-q01rpg
    paths:
      - 'supabase/migrations/20260804000001_whatsapp_disconnect_alerts.sql'
      - '.github/workflows/whatsapp-alerts-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply whatsapp_disconnect_alerts migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260804000001_whatsapp_disconnect_alerts.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
