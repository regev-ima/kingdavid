name: Document terms — let Settings reach the documents

# Drops the copy of the legal wording that every quote and every order was
# saved with, so the standard texts resolve live from
# הגדרות ← טקסטים ותנאים again. Wording a rep actually rewrote on a quote is
# matched against the standard texts and left alone.
#
# Applies 20260806000002 first: it created app_settings and the orders columns,
# it was applied by hand and has no workflow of its own, and it is idempotent —
# so running it here costs nothing and guarantees the prerequisite is in place.
#
# Both files are idempotent; verified with
# `scripts/local-test-db.sh <file> --twice`. Same pattern as
# permission-roles-migrate.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260810000002_document_terms_follow_settings.sql'
      - '.github/workflows/document-terms-follow-settings-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply document terms migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          for f in \
            supabase/migrations/20260806000002_app_settings_and_order_terms.sql \
            supabase/migrations/20260810000002_document_terms_follow_settings.sql
          do
            echo "── $f"
            payload=$(jq -Rs '{query: .}' "$f")
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")
            echo "Management API HTTP $code"
            cat /tmp/resp.json || true
            echo
            test "$code" -lt 400
          done
