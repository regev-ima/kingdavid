name: Import effective_sort_date — apply migration

# Makes process_lead_import set effective_sort_date itself instead of leaning on
# the BEFORE INSERT trigger, so import-leads-run.yml can suppress triggers for
# speed without leaving dateless leads invisible to every date-range filter.
# CREATE OR REPLACE — idempotent. Runs on the feature branch too, so the bulk
# runner can be used before the merge.

on:
  push:
    branches:
      - main
      - claude/payment-custom-items-ipi3jv
    paths:
      - 'supabase/migrations/20260803000005_import_sets_effective_sort_date.sql'
      - '.github/workflows/import-effective-sort-date-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply effective_sort_date migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260803000005_import_sets_effective_sort_date.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
