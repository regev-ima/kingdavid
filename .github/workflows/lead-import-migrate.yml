name: Lead import + contact resolution — apply migration

# Applies the lead-import / contact-resolution migration via the Supabase
# Management API on push to main. Idempotent (IF NOT EXISTS everywhere,
# CREATE OR REPLACE FUNCTION, DROP POLICY IF EXISTS, guarded DO blocks), so
# re-runs are safe. Same pattern as performance-indexes-2-migrate.yml.
#
# The migration raises statement_timeout to 600s itself — adding the generated
# phone_normalized column rewrites the ~104k-row leads table.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260726000001_lead_import.sql'
      - '.github/workflows/lead-import-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply lead_import migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260726000001_lead_import.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
