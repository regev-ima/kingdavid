name: rep_stats + activity — apply migration

# Puts public.rep_stats under version control and adds last_activity_at.
# Idempotent (CREATE OR REPLACE throughout), so re-runs are safe.
#
# After it runs, check which activity sources the migration actually found —
# the Management API swallows RAISE NOTICE, so the decision is recorded in the
# view comment instead:
#   SELECT obj_description('public.rep_stats'::regclass);

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260727000003_rep_stats_activity.sql'
      - '.github/workflows/rep-stats-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply rep_stats activity migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260727000003_rep_stats_activity.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400

      - name: Report which activity sources were chosen
        if: success()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          q="SELECT obj_description('public.rep_stats'::regclass) AS sources;"
          payload=$(jq -Rns --arg q "$q" '{query: $q}')
          curl -sS -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload"
          echo
