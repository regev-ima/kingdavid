name: WhatsApp Chat Aggregates — apply migration

# Adds whatsapp_chat_reps (the rep filter, independent of any page size) and
# whatsapp_chat_overview() (the per-rep counts behind the manager cards and the
# waiting banner), plus the indexes the now server-side ordering/filtering
# needs. Idempotent. Runs on the feature branch too so the preview has them.

on:
  push:
    branches:
      - main
      - claude/payment-custom-items-ipi3jv
    paths:
      - 'supabase/migrations/20260803000002_whatsapp_chat_aggregates.sql'
      - '.github/workflows/whatsapp-aggregates-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply whatsapp_chat_aggregates migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260803000002_whatsapp_chat_aggregates.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
