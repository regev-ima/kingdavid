name: WhatsApp chat contact identity — apply migration

# Repairs whatsapp_chats rows whose contact_name / contact_phone were seeded
# from senderData on an outgoing webhook — i.e. from the REP rather than the
# customer, which put the rep's own WhatsApp name and number on every
# conversation in the list. Data-only and idempotent.
#
# Unlike the other whatsapp migrations this one is deliberately NOT wired to the
# feature branch: it rewrites existing rows rather than adding structure, so it
# waits for the merge to main. Use workflow_dispatch to run it sooner.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260805000001_whatsapp_chat_contact_identity.sql'
      - '.github/workflows/whatsapp-contact-identity-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply whatsapp_chat_contact_identity migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260805000001_whatsapp_chat_contact_identity.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
