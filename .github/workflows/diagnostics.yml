name: Diagnostics — run a read-only check

# Runs one of the scripts in scripts/ against production and prints the result
# as a table in the run summary. Replaces "paste this file into the SQL Editor
# and send me a screenshot" with a dropdown and a button.
#
# The script list is a fixed allowlist and the dispatch input is a choice, not
# free text, so this workflow cannot be pointed at arbitrary SQL. None of the
# four touches business data: three are pure SELECT, and delete-impact builds a
# session-local TEMP table it then reads back. That is what makes it safe to
# also run on push — the same reasoning does NOT extend to adding a migration
# to the allowlist.
#
# The push trigger exists because a check nobody runs answers nothing. Editing
# a check is exactly the moment its result matters, so a merge that touches one
# runs the readiness check rather than waiting for someone to remember.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Which check to run'
        required: true
        type: choice
        default: import-readiness
        options:
          - import-readiness
          - status-check
          - duplicate-inflow-check
          - delete-impact
  push:
    branches:
      - main
    paths:
      - 'scripts/import-readiness.sql'
      - '.github/workflows/diagnostics.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run the check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # inputs.script is empty on a push event — only workflow_dispatch
          # supplies it. Without the fallback SCRIPT would be blank and the
          # path check below would fail on "scripts/.sql".
          SCRIPT: ${{ inputs.script || 'import-readiness' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi

          f="scripts/${SCRIPT}.sql"
          # The choice input already constrains this, but a renamed or deleted
          # script should say so rather than POSTing an empty query.
          if [ ! -f "$f" ]; then
            echo "::error::$f not found"; exit 1
          fi

          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -Rs '{query: .}' "$f")")

          if [ "$code" -ge 400 ]; then
            echo "::error::Management API returned HTTP $code"
            cat /tmp/resp.json || true
            exit 1
          fi

          {
            echo "## ${SCRIPT}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # The API answers an array of row objects. Render whatever columns
          # come back rather than hard-coding them, so each script can return
          # its own shape. Scripts that end in several statements yield several
          # arrays, so find the last non-empty one.
          rows=$(jq -c '[.. | arrays | select(length > 0) | select(.[0] | type == "object")] | last // []' /tmp/resp.json)

          if [ "$(jq 'length' <<<"$rows")" = "0" ]; then
            echo "_(no rows)_" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/resp.json
            exit 0
          fi

          # Markdown table: header from the first row's keys, then every row in
          # that same key order.
          #
          # to_entries rather than keys — keys SORTS, which would reorder the
          # columns away from the order the script wrote them, and
          # keys_unordered is not in every jq. Pipes inside a value would break
          # the table, so they are escaped. null becomes empty, but 0 and false
          # are printed: `// ""` would have silently blanked a real zero.
          jq -r '
            ([.[0] | to_entries | .[].key]) as $cols
            | "| " + ($cols | join(" | ")) + " |",
              "| " + ($cols | map("---") | join(" | ")) + " |",
              (.[] | . as $r
               | "| " + ([$cols[] as $c
                          | ($r[$c] | if . == null then "" else tostring end)
                          | gsub("\\|"; "\\|")] | join(" | ")) + " |")
          ' <<<"$rows" >> "$GITHUB_STEP_SUMMARY"

          # Also to the log, so the result is readable without opening Summary.
          jq -r '.[] | to_entries | map("\(.key)=\(.value)") | join("  ")' <<<"$rows"

          echo
          echo "✅ done — full table is in the run Summary"
