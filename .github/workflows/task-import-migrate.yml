name: Task import — apply migration

# Creates the task-history import: task_import_batches / task_import_rows,
# process_task_import(), and sales_tasks.unique_id. Kaveret's task export goes
# in through הגדרות → ייבוא משימות. CREATE IF NOT EXISTS + CREATE OR REPLACE —
# idempotent. Runs on the feature branch too, so the first import can be run
# before the merge.

on:
  push:
    branches:
      - main
      - claude/scroll-issue-yzabql
    paths:
      - 'supabase/migrations/20260902000002_task_import.sql'
      - '.github/workflows/task-import-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply task import migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260902000002_task_import.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
