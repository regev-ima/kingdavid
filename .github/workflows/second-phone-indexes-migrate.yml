name: Second-phone search indexes — apply migration

# Applies the second-phone search indexes via the Supabase Management API on
# push to main. Idempotent (CREATE INDEX IF NOT EXISTS), so re-runs are safe.
# Same pattern as search-indexes-migrate.yml.
#
# The indexes are not optional garnish: the client half of this change adds an
# OR branch on phone_2, and Postgres only builds a BitmapOr when every branch
# is indexed. Without this workflow running, the search falls back to a
# sequential scan on a 125k-row table.
#
# The migration raises statement_timeout to 600s itself — four GIN builds on
# large tables run past the Management API's default.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260820000003_second_phone_search_indexes.sql'
      - '.github/workflows/second-phone-indexes-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply second_phone_search_indexes migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260820000003_second_phone_search_indexes.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
