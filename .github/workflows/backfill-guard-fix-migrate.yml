name: Backfill guard fix — apply migration

# Rebuilds backfill_lead_contacts() on a guard that also accepts a no-JWT
# connection (SQL Editor / service_role / cron), and adds the looping wrapper
# backfill_lead_contacts_all(). Idempotent (CREATE OR REPLACE throughout), so
# re-runs are safe. Same pattern as lead-import-migrate.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260727000001_backfill_guard_fix.sql'
      - '.github/workflows/backfill-guard-fix-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply backfill guard fix migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260727000001_backfill_guard_fix.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
