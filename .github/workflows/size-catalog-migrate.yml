name: Size catalog + SKU prefix — apply migration

# Adds width_cm / length_cm / size_surcharge to global_sizes and
# sku_prefix / base_size_id to products, then backfills the dimensions from the
# free-text `dimensions` field. Additive only — nothing reads the new columns
# until the product screens do, and the app falls back to parsing the text
# wherever a width/length is still missing. Idempotent.

on:
  push:
    branches:
      - main
      - claude/auto-assign-lead-rep-manager-opskej
    paths:
      - 'supabase/migrations/20260804000005_size_catalog_and_sku_prefix.sql'
      - '.github/workflows/size-catalog-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply size-catalog migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260804000005_size_catalog_and_sku_prefix.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
