name: Self pickup — apply migration

# Adds is_self_pickup to quotes / orders — the flag that marks an order the
# customer collects from the factory (no delivery address, no delivery/assembly
# extras, "איסוף עצמי - בתיאום" printed on the PDF). Without this migration the
# column doesn't exist and the flag is silently lost on save, so the order comes
# back looking like an ordinary delivery.
# ADD COLUMN IF NOT EXISTS — idempotent. Runs on the feature branch too so the
# preview deployment has the column.

on:
  push:
    branches:
      - main
      - claude/credit-card-digits-missing-kpv1fd
    paths:
      - 'supabase/migrations/20260805000005_self_pickup.sql'
      - '.github/workflows/self-pickup-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply self-pickup migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260805000005_self_pickup.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
