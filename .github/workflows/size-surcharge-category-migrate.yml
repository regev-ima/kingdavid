name: Size surcharge per category — apply migration

# Adds global_sizes.surcharges (jsonb: category → amount) so a bed and a
# mattress in the same size can carry different upcharges, and moves the
# existing single amount into the "mattress" key. Additive; size_surcharge
# stays as the fallback. Idempotent.

on:
  push:
    branches:
      - main
      - claude/auto-assign-lead-rep-manager-opskej
    paths:
      - 'supabase/migrations/20260804000008_size_surcharge_per_category.sql'
      - '.github/workflows/size-surcharge-category-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply per-category surcharge migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260804000008_size_surcharge_per_category.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
