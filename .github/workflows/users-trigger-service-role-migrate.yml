name: Allow service_role through the users trigger — apply migration

# prevent_users_privilege_escalation identifies its caller with
# `WHERE auth_id = auth.uid()`, which is NULL for an edge function holding the
# service-role key — so the invite flow's `UPDATE users SET auth_id = ...` was
# rejected and every invited rep kept auth_id = NULL. Since the RLS delete
# policies all match on auth_id, those users silently cannot delete anything.
# This adds a service_role short-circuit (keeping all ten existing guards) and
# backfills the rows the broken trigger left unlinked. Idempotent.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260830000001_users_trigger_allow_service_role.sql'
      - '.github/workflows/users-trigger-service-role-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply users trigger service_role migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260830000001_users_trigger_allow_service_role.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
