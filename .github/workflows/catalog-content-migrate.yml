name: Catalog content — apply migration

# Applies the 2025 catalogue-content import via the Supabase Management API on
# push to main. In this repo migrations do not run on their own — each one has
# a workflow like this — and the first merge of the import (PR #409) shipped
# without one, which is why nothing appeared on the products.
#
# Idempotent: matching is deterministic and every write is COALESCE-guarded,
# so re-running just re-asserts the same content. Prices are never read.
#
# The second step prints the answer to "which mattresses still have no
# description" straight into this workflow's log, so the gap-list lives where
# the run that produced it lives.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260818000001_catalog_content_import.sql'
      - '.github/workflows/catalog-content-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the catalogue content migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260818000001_catalog_content_import.sql
          echo "── $f"
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400

      - name: Report — mattresses still without a description
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          q="SELECT name FROM public.products WHERE category = 'mattress' AND is_active = true AND (description IS NULL OR btrim(description) = '') ORDER BY name;"
          payload=$(jq -n --arg q "$q" '{query: $q}')
          code=$(curl -sS -o /tmp/report.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          echo "── מזרנים פעילים שעדיין בלי תיאור (לא נמצאו בקובץ הקטלוג):"
          jq -r '.[].name // empty' /tmp/report.json 2>/dev/null || cat /tmp/report.json
          test "$code" -lt 400
