name: Uploads bucket — widen the MIME allowlist

# Re-asserts the 'uploads' bucket's allowed_mime_types so the file types the
# app's pickers offer (Word, PowerPoint, text, iPhone HEIC photos, short
# videos) can actually be stored. Without this the migration merges to main and
# never runs, and attaching any of them keeps failing at the bucket — which is
# the bug this branch is fixing.
#
# Idempotent (INSERT … ON CONFLICT DO UPDATE), so re-running is safe.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260813000001_uploads_mime_types.sql'
      - '.github/workflows/uploads-mime-types-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the uploads MIME allowlist migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260813000001_uploads_mime_types.sql
          echo "── $f"
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
