name: WhatsApp templates — add the "orders" category

# Rebuilds the CHECK on whatsapp_templates.category so it accepts 'orders',
# and seeds a starter template for it.
#
# Without this workflow the migration merged to main and never ran: the client
# offered "הזמנות" in the category dropdown while the database still allowed
# only four values, so saving a template failed with
# `violates check constraint "whatsapp_templates_category_check"`.
#
# Idempotent (DROP CONSTRAINT IF EXISTS before ADD, seed guarded by NOT EXISTS);
# verified with `scripts/local-test-db.sh <file> --twice`, which also checked
# that 'orders' is accepted and an unknown category is still rejected.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260811000001_whatsapp_orders_category.sql'
      - '.github/workflows/whatsapp-orders-category-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the orders-category migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260811000001_whatsapp_orders_category.sql
          echo "── $f"
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
