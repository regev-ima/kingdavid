name: Close assignment tasks of assigned leads — apply migration

# Closes the open `assignment` tasks ("יש לשייך את הליד לנציג") of leads that
# already have a rep. The bulk assignment bar on /LeadManagement used to write
# leads.rep1 alone, so a lead assigned that way kept asking to be assigned every
# time somebody opened it, and its task stayed in the admin's "להקצות" queue.
# That path now performs the full handover (src/lib/leadAssignment.js); this
# clears the rows it left behind. Re-runnable: a second run matches nothing.
#
# main only, on purpose — unlike the schema migrations here this one EDITS DATA,
# so it lands when the pull request is merged rather than on every push to the
# feature branch. Run it earlier from the Actions tab if you want the backlog
# cleared before the merge.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260806000002_close_assignment_tasks_of_assigned_leads.sql'
      - '.github/workflows/close-assignment-tasks-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply close-assignment-tasks migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260806000002_close_assignment_tasks_of_assigned_leads.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
