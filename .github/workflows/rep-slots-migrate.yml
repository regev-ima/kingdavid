name: Rep slots — apply migration

# Clears rep2 wherever it duplicates the record's primary rep (rep1, or
# account_manager on a customer) across leads / customers / orders. The pickers,
# the bulk-update runner and the rep-transfer batch enforce the rule going
# forward; this repairs the rows they left behind — mostly rep transfers, which
# rewrote both slots to the same person. Re-runnable: a second run matches
# nothing.

on:
  push:
    branches:
      - main
      - claude/auto-assign-lead-rep-manager-opskej
    paths:
      - 'supabase/migrations/20260804000004_rep_slots_one_person_one_slot.sql'
      - '.github/workflows/rep-slots-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply rep-slots migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260804000004_rep_slots_one_person_one_slot.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
