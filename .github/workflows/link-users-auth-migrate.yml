name: Link users to auth accounts — apply migration

# Fills public.users.auth_id where it was never linked, matching on the email
# Supabase Auth already verified. Without the link every RLS delete policy
# refuses — and PostgREST reports the refusal as a success with no rows, so
# deletes appear to do nothing. Only touches rows whose auth_id IS NULL and
# whose email matches exactly one auth account. Idempotent.

on:
  push:
    branches:
      - main
      - claude/auto-assign-lead-rep-manager-opskej
    paths:
      - 'supabase/migrations/20260804000007_link_users_auth_id.sql'
      - '.github/workflows/link-users-auth-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply users auth_id linking migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260804000007_link_users_auth_id.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
