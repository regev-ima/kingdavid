name: User avatar identity — apply migrations

# 1. 20260812000002 added users.avatar_slot (a combined colour+icon index).
# 2. 20260812000003 splits it: users.avatar_color for the hue, profile_icon
#    (already there) for the icon, and drops avatar_slot. Both nullable, so
#    every existing rep keeps the identity the automatic assignment gives them.
# Applied in order; both are idempotent.

on:
  push:
    branches:
      - main
      - claude/leads-filter-rep-column-wknyzl
    paths:
      - 'supabase/migrations/20260812000002_user_avatar_slot.sql'
      - 'supabase/migrations/20260812000003_user_avatar_color.sql'
      - '.github/workflows/user-avatar-slot-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply avatar-identity migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          for f in \
            supabase/migrations/20260812000002_user_avatar_slot.sql \
            supabase/migrations/20260812000003_user_avatar_color.sql
          do
            echo "── $f"
            payload=$(jq -Rs '{query: .}' "$f")
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")
            echo "Management API HTTP $code"
            cat /tmp/resp.json || true
            echo
            test "$code" -lt 400
          done
