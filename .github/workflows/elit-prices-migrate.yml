name: עלית — fix prices entered as pre-VAT

# The catalogue's including-VAT prices for עלית were typed into the pre-VAT
# field, so the customer price came out 18% high (₪6,962 instead of ₪5,900).
# The migration divides the eight ELT sizes by 1.18 via explicit old→new
# pairs, so it only ever fires on the wrong values and a re-run is a no-op.
#
# The verify step prints the eight rows with their including-VAT price, which
# should read exactly the catalogue numbers.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260819000002_elit_prices_were_incl_vat.sql'
      - '.github/workflows/elit-prices-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the עלית price fix
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260819000002_elit_prices_were_incl_vat.sql
          echo "── $f"
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400

      - name: Verify — the eight sizes at their catalogue prices
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          q="SELECT sku, base_price, final_price, round(final_price * 1.18) AS incl_vat
             FROM public.product_variations
             WHERE sku IN ('ELT140190','ELT140200','ELT150190','ELT150200','ELT160190','ELT160200','ELT180200','ELT200200')
             ORDER BY sku;"
          payload=$(jq -n --arg q "$q" '{query: $q}')
          code=$(curl -sS -o /tmp/verify.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          echo "── מידות עלית אחרי התיקון (incl_vat = מה שהלקוח רואה):"
          jq -r '.[] | "\(.sku)\tלפני: \(.final_price)\tכולל: \(.incl_vat)"' /tmp/verify.json 2>/dev/null || cat /tmp/verify.json
          test "$code" -lt 400
