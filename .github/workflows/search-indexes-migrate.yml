name: Search trigram indexes — apply migration

# Applies the lead/customer search indexes via the Supabase Management API on
# push to main. Idempotent (CREATE EXTENSION / CREATE INDEX, both IF NOT
# EXISTS), so re-runs are safe. Same pattern as lead-import-migrate.yml.
#
# This workflow is the whole point of the change: the previous attempt at these
# indexes (20260428000001_phone_trigram_indexes.sql) was merged without one and
# therefore never ran, which is why the search was still reading 125k rows four
# months later.
#
# The migration raises statement_timeout to 600s itself — seven GIN builds on a
# 125k-row table take a couple of seconds locally, but the Management API's
# default timeout is shorter than a slow production build.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260820000001_search_trigram_indexes.sql'
      - '.github/workflows/search-indexes-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply search_trigram_indexes migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets"; exit 1
          fi
          f=supabase/migrations/20260820000001_search_trigram_indexes.sql
          payload=$(jq -Rs '{query: .}' "$f")
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "Management API HTTP $code"
          cat /tmp/resp.json || true
          echo
          test "$code" -lt 400
